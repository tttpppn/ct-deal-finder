<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CT Deal Finder - Real Estate Deals</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; }
    header { text-align: center; margin-bottom: 40px; border-bottom: 3px solid #667eea; padding-bottom: 20px; }
    h1 { color: #333; font-size: 2.5em; margin-bottom: 10px; }
    .subtitle { color: #666; font-size: 1.1em; margin-bottom: 10px; }
    .last-updated { color: #999; font-size: 0.9em; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-align: center; }
    .stat-number { font-size: 2.5em; font-weight: bold; margin-bottom: 5px; }
    .stat-label { font-size: 0.9em; opacity: 0.9; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    input, select { padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 1em; }
    button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #764ba2; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    thead { background-color: #f8f9fa; border-bottom: 2px solid #667eea; }
    th { padding: 15px; text-align: left; font-weight: 600; color: #333; }
    td { padding: 12px 15px; border-bottom: 1px solid #eee; }
    tr:hover { background-color: #f5f5f5; }
    .deal-rating { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
    .rating-high { background-color: #d4edda; color: #155724; }
    .rating-medium { background-color: #fff3cd; color: #856404; }
    .rating-low { background-color: #f8d7da; color: #721c24; }
    a { color: #667eea; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .error { background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 6px; margin: 20px 0; }
    .no-data { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏠 CT Real Estate Deal Finder</h1>
      <p class="subtitle">Judicial Foreclosures + Bank REO Listings</p>
      <p class="last-updated">Last Updated: <span id="lastUpdated">Loading...</span></p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="totalDeals">0</div>
        <div class="stat-label">Total Deals</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="avgDiscount">0%</div>
        <div class="stat-label">Avg Discount</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="avgCapRate">0%</div>
        <div class="stat-label">Avg Cap Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="avgReturn">0%</div>
        <div class="stat-label">Avg Cash-on-Cash</div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search address..." style="flex: 1; min-width: 200px;">
      <select id="townFilter">
        <option value="">All Towns</option>
        <option value="Cheshire">Cheshire</option>
        <option value="Madison">Madison</option>
        <option value="Guilford">Guilford</option>
        <option value="Orange">Orange</option>
      </select>
      <button onclick="resetFilters()">Reset</button>
    </div>

    <div id="loading" class="loading">Loading deals...</div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="noData" class="no-data" style="display:none;">No deals found.</div>

    <table id="dealsTable" style="display:none;">
      <thead>
        <tr>
          <th>Address</th>
          <th>Town</th>
          <th>Source</th>
          <th>List Price</th>
          <th>Discount %</th>
          <th>Cap Rate %</th>
          <th>Cash-on-Cash %</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    let allDeals = [];

    async function loadDeals() {
      try {
        const response = await fetch('data.csv');
        if (!response.ok) throw new Error('CSV not found');
        const csv = await response.text();
        const lines = csv.trim().split('\n');
        const headers = lines[0].split(',');
        allDeals = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const values = lines[i].split(',');
          const deal = {};
          headers.forEach((header, idx) => {
            deal[header.trim()] = values[idx] ? values[idx].trim() : '';
          });
          allDeals.push(deal);
        }
        displayDeals(allDeals);
        updateStats(allDeals);
        updateLastUpdated();
      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Error loading deals: ' + error.message;
      }
    }

    function displayDeals(deals) {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      if (deals.length === 0) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dealsTable').style.display = 'none';
        document.getElementById('noData').style.display = 'block';
        return;
      }
      deals.forEach(deal => {
        const row = document.createElement('tr');
        const discount = parseFloat(deal['Discount %']) || 0;
        let ratingClass = discount > 18 ? 'rating-high' : discount > 15 ? 'rating-medium' : 'rating-low';
        row.innerHTML = `
          <td><strong>${deal['Address']}</strong></td>
          <td>${deal['Town']}</td>
          <td>${deal['Source'].includes('judicial') ? 'Judicial' : 'Bank REO'}</td>
          <td>$${parseInt(deal['List Price'].replace(/\D/g,'')).toLocaleString()}</td>
          <td><span class="deal-rating ${ratingClass}">${discount.toFixed(2)}%</span></td>
          <td>${parseFloat(deal['Cap Rate %']).toFixed(2)}%</td>
          <td>${parseFloat(deal['Cash-on-Cash %']).toFixed(2)}%</td>
          <td><a href="${deal['Link']}" target="_blank">View</a></td>
        `;
        tableBody.appendChild(row);
      });
      document.getElementById('loading').style.display = 'none';
      document.getElementById('dealsTable').style.display = 'table';
      document.getElementById('noData').style.display = 'none';
    }

    function updateStats(deals) {
      document.getElementById('totalDeals').textContent = deals.length;
      const avgDiscount = deals.reduce((sum, d) => sum + (parseFloat(d['Discount %']) || 0), 0) / deals.length;
      document.getElementById('avgDiscount').textContent = avgDiscount.toFixed(1) + '%';
      const avgCapRate = deals.reduce((sum, d) => sum + (parseFloat(d['Cap Rate %']) || 0), 0) / deals.length;
      document.getElementById('avgCapRate').textContent = avgCapRate.toFixed(2) + '%';
      const avgReturn = deals.reduce((sum, d) => sum + (parseFloat(d['Cash-on-Cash %']) || 0), 0) / deals.length;
      document.getElementById('avgReturn').textContent = avgReturn.toFixed(1) + '%';
    }

    function updateLastUpdated() {
      const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('lastUpdated').textContent = today;
    }

    function filterDeals() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const town = document.getElementById('townFilter').value;
      const filtered = allDeals.filter(deal => {
        const matchSearch = !search || deal['Address'].toLowerCase().includes(search);
        const matchTown = !town || deal['Town'] === town;
        return matchSearch && matchTown;
      });
      displayDeals(filtered);
      updateStats(filtered);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('townFilter').value = '';
      displayDeals(allDeals);
      updateStats(allDeals);
    }

    document.getElementById('searchInput').addEventListener('input', filterDeals);
    document.getElementById('townFilter').addEventListener('change', filterDeals);
    loadDeals();
  </script>
</body>
</html>
