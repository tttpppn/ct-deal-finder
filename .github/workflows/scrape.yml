name: Daily Deal Scraper

on:
  schedule:
    # Run every day at 9 AM UTC (4 AM EST)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Manual trigger button in GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: npm start

      - name: Copy CSV to public folder for dashboard
        run: |
          mkdir -p public
          cp below_market_deals-*.csv public/data.csv || echo "No CSV file found"

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add below_market_deals-*.csv public/data.csv
          git commit -m "Daily deal scrape: $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
