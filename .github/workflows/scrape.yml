name: Daily Deal Scraper

on:
  schedule:
    # Run every day at 9 AM UTC (4 AM EST)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Manual trigger button in GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: npm start

      - name: Copy CSV to docs folder for dashboard
        run: |
          mkdir -p docs
          cp below_market_deals-*.csv docs/data.csv || echo "No CSV file found"

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add below_market_deals-*.csv docs/data.csv
          git commit -m "Daily deal scrape: $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
